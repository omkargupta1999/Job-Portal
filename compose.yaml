# JobHub - self-hosted job discovery. Start with: docker compose up -d --build
name: jobhub

services:
  jobhub:
    build:
      context: .
      target: runtime
      args:
        PYTHON_IMAGE: ${JOBHUB_PYTHON_IMAGE:-python:3.12-slim}
    image: jobhub:latest
    container_name: jobhub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container the app listens on all interfaces. Exposure on the
      # host is controlled by the port binding below, which uses JOBHUB_HOST
      # and JOBHUB_PORT from .env (default 127.0.0.1:8080 = this machine only).
      JOBHUB_HOST: 0.0.0.0
      JOBHUB_PORT: "8080"
      JOBHUB_DATA_DIR: /data
    ports:
      - "${JOBHUB_HOST:-127.0.0.1}:${JOBHUB_PORT:-8080}:8080"
    volumes:
      - jobhub-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jobhub-data:
    name: jobhub-data
